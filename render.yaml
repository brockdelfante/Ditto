services:
  - type: web
    name: hubspot-mcp-assistant
    env: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: HUBSPOT_CLIENT_ID
        sync: false
      - key: HUBSPOT_CLIENT_SECRET
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: REDIRECT_URI
        sync: false
      - key: SESSION_SECRET
        generateValue: true
